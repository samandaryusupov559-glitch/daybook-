/* ---------------- events ---------------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  const popEl = $('#pop .pop');
  if(popEl && !popEl.contains(ev.target) && !(b && (b.dataset.act==='ann-open'))){
    if(!ev.target.closest('.mk')) closePop();
  }
  // marks inside papers
  const mk = ev.target.closest('.mk');
  if(mk && !b){
    const R=S.review;
    if(S.mode==='teacher' && R && S.view.name==='review'){
      if(!getSelection().isCollapsed) return;
      const id=mk.dataset.id, rect=mk.getBoundingClientRect();
      if(mk.dataset.kind==='sug'){ const s=R.sugs.find(x=>x.id===id); if(s) openSugPop(s,rect); }
      else { const a=R.data.annotations.find(x=>x.id===id); if(a){ R.selId=id; renderPaper(); openAnnPop(a,rect,false); } }
    } else if(S.mode==='student' && S.view.name==='entry'){
      const rv=S.myReviews[S.view.eid]; const a=(rv?.annotations||[]).find(x=>x.id===mk.dataset.id); if(!a) return; const t=TYPE[a.type]||TYPE.gr;
      $('#pop').innerHTML=`<div class="pop" role="dialog" aria-label="${tr('en.corrAria')}"><div class="row"><span class="tchip t-${t.k}"><span class="code">${t.code}</span>${t.name}</span></div>
        ${a.type==='good'?`<div class="quote">“${esc(a.quote)}”</div>`:`<div><span class="label">${tr('en.youWrote')}</span><div class="quote" style="margin-top:4px">${esc(a.quote)}</div></div>${a.correction?`<div><span class="label">${tr('en.better')}</span><div class="fix" style="margin-top:2px">${esc(a.correction)}</div></div>`:''}`}
        ${a.note?`<p class="small" style="color:var(--ink-2)">${esc(a.note)}</p>`:''}<div class="pop-acts"><button class="btn sm" data-act="pop-close">${tr('en.gotIt')}</button></div></div>`;
      placePop($('#pop .pop'), mk.getBoundingClientRect());
    }
    return;
  }
  if(!b) return;
  const act=b.dataset.act, R=S.review;
  switch(act){
    case 'go': if(b.dataset.v==='write'){ startEdit(); } else go(b.dataset.v); break;
    case 'lang': setLang(b.dataset.l); break;
    case 'demo': startDemo('teacher'); break;
    case 'explore': startDemo('teacher'); break;
    case 'sign-out': if(S.au) S.au.signOut(S.auth); break;
    case 'login-step': S.view={name:'login',step:b.dataset.s,email:($('#login-email')?.value||S.view.email||'').trim()}; renderMain(); break;
    case 'pw-signin': case 'pw-signup': { const email=($('#login-email')?.value||'').trim(), pass=$('#login-pass')?.value||'';
      if(!/^\S+@\S+\.\S+$/.test(email)){ toast(tr('lo.badEmail')); break; } if(pass.length<6){ toast(tr('lo.short')); break; }
      b.disabled=true; LS.set('last-email',email);
      try{ act==='pw-signup' ? await S.au.createUserWithEmailAndPassword(S.auth,email,pass) : await S.au.signInWithEmailAndPassword(S.auth,email,pass); }
      catch(e){ toast(authMsg(e)); b.disabled=false; } break; }
    case 'pw-reset': { const email=($('#login-email')?.value||'').trim(); if(!/^\S+@\S+\.\S+$/.test(email)){ toast(tr('lo.badEmail')); break; }
      b.disabled=true; try{ await S.au.sendPasswordResetEmail(S.auth,email); toast(tr('lo.resetSent')); S.view={name:'login',step:'signin',email}; renderMain(); }catch(e){ toast(authMsg(e)); b.disabled=false; } break; }
    case 'send-link': { const email=($('#login-email')?.value||'').trim(); if(!/^\S+@\S+\.\S+$/.test(email)){ toast(tr('lo.badEmail')); break; }
      b.disabled=true; b.textContent=tr('lo.sending');
      try{ await S.au.sendSignInLinkToEmail(S.auth, email, {url: location.origin+location.pathname, handleCodeInApp:true}); LS.set('signin-email',email); S.view={name:'login',step:'sent',email}; renderMain(); }
      catch(e){ toast(authMsg(e)); b.disabled=false; b.textContent=tr('lo.sendLink'); } break; }
    case 'confirm-link': { const email=($('#login-email')?.value||'').trim(); if(!email){ toast(tr('lo.typeEmail')); break; } b.disabled=true; await completeSignIn(email); break; }
    case 'demo-role': startDemo(b.dataset.role); break;
    case 'leave-demo': leaveDemo(); break;
    case 'open-review': openReview(b.dataset.sid,b.dataset.eid); break;
    case 'open-student': go('student',{sid:b.dataset.sid}); break;
    case 'open-entry': go('entry',{eid:b.dataset.eid}); break;
    case 'rv-view': R.view=b.dataset.v; closePop(); renderReviewTools(); renderPaper(); break;
    case 'ai': aiSuggest(); break;
    case 'copy-fixed': { const txt=correctedText(R.entry.body,R.data.annotations); try{ await navigator.clipboard.writeText(txt); toast(tr('t.copied')); }catch(e){ R.view='corrected'; renderReviewTools(); renderPaper(); const r=document.createRange(); r.selectNodeContents($('#paper-text')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(tr('t.selected')); } break; }
    case 'pop-type': { const P=S.pop; if(!P||!P.a) break; P.a.type=b.dataset.k; document.querySelectorAll('#pop .types .tchip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===P.a.type)); const w=$('#pf-fix-wrap'); if(w) w.hidden = P.a.type==='good'; (P.a.type==='good'?$('#pf-note'):$('#pf-fix')).focus(); break; }

    case 'pop-del': { const id=S.pop?.a?.id; R.data.annotations=R.data.annotations.filter(a=>a.id!==id); closePop(); renderPaper(); renderAnnList(); scheduleSave(); break; }
    case 'ann-open': { const a=R.data.annotations.find(x=>x.id===b.dataset.id); if(!a) break; R.view='marked'; R.selId=a.id; renderReviewTools(); renderPaper(); const el=$(`#paper-text .mk[data-id="${CSS.escape(a.id)}"]`); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>openAnnPop(a,el.getBoundingClientRect(),false),260);} break; }

      if(act==='sug-accept'){ R.data.annotations.push({...s,id:newId()}); scheduleSave(); }

    case 'sug-none': R.sugs=[]; renderReviewTools(); renderPaper(); break;
    case 'band': { const k=b.dataset.k; let v=R.data.bands[k]; v = v==null ? 5 : Math.min(9,Math.max(0,v+Number(b.dataset.d))); R.data.bands[k]=v; $('#band-'+k).textContent=fmtBand(v); $('#band-overall').textContent=fmtBand(overallBand(R.data.bands)); scheduleSave(); break; }
    case 'bank-ins': { const t=(S.prefs?.bank||DEFAULT_BANK)[+b.dataset.i]; const c=$('#rv-comment'); c.value = (c.value.trim()? c.value.trim()+' ':'')+t; R.data.comment=c.value; scheduleSave(); c.focus(); break; }
    case 'vocab-add': { const w=$('#vw').value.trim(), m=$('#vm').value.trim(), x=$('#vx').value.trim(); if(!w||!m){ toast(tr('t.wordMeaning')); break; } R.data.vocab=R.data.vocab||[]; R.data.vocab.push({w,m,ex:x}); $('#vw').value=$('#vm').value=$('#vx').value=''; renderVocab(); scheduleSave(); $('#vw').focus(); break; }
    case 'vocab-del': R.data.vocab.splice(+b.dataset.i,1); renderVocab(); scheduleSave(); break;
    case 'finish': { const st=b.dataset.st; if(overallBand(R.data.bands)==null && st==='reviewed' && !b.dataset.ok){ b.dataset.ok='1'; b.textContent=tr('t.noBands'); break; }
      document.querySelectorAll('[data-act="finish"]').forEach(x=>x.disabled=true);
      await saveReview(st); toast(st==='reviewed'?tr('t.returned'):tr('t.revReq'));
      { const sid=R.sid, title=R.entry.title||''; notify('review',[sid],()=>({subject:tr(st==='reviewed'?'em.reviewT':'em.reviseT',{title}), kicker:tr('em.reviewK'), lines:[tr('em.reviewL')]})); }
      const next=allEntries().filter(x=>x.status==='submitted'&&!(x.sid===R.sid&&x.eid===R.eid)).sort((a,b)=>(a.submittedAt||0)-(b.submittedAt||0))[0];
      if(next) openReview(next.sid,next.eid); else go('inbox'); break; }
    case 'save-prompt': { const t=$('#prompt-txt').value.trim(); if(!t){ toast(tr('t.promptFirst')); break; } try{ await S.db.doc('settings/prompt').set({text:t,setAt:Date.now()}); toast(tr('t.promptPub')); notify('prompt','all',()=>({subject:tr('em.promptT'), kicker:tr('em.promptK'), lines:[t]})); }catch(e){ dbErr(e,'prompt'); } break; }
    case 'clear-prompt': try{ await S.db.doc('settings/prompt').delete(); $('#prompt-txt').value=''; toast(tr('t.promptDel')); }catch(e){ dbErr(e,'unprompt'); } break;
    case 'use-idea': $('#prompt-txt').value=b.dataset.t; $('#prompt-txt').focus(); break;
    case 'bank-add': { const v=$('#bank-new').value.trim(); if(!v) break; S.prefs=S.prefs||{bank:DEFAULT_BANK.slice()}; S.prefs.bank.unshift(v); await savePrefs(); renderMain(); break; }

    case 'em-test': mailTest(); break;
    case 'em-ev': { const on={...S.mail.on, [b.dataset.ev]:b.checked}; try{ await S.db.doc('private/mail').set({url:S.mail.url, secret:S.mail.secret, on}); }catch(e){ b.checked=!b.checked; dbErr(e,'mail'); } break; }
    case 'em-me': { const want={email:S.me?.email||'', lang:LANG, off:!b.checked}; try{ await S.db.doc('contacts/'+S.uid).set(want); toast(tr('bk.saved')); }catch(e){ b.checked=!b.checked; dbErr(e,'mail'); } break; }
    case 'mk-new': openMkItem(); break;
    case 'mk-edit': openMkItem(b.dataset.id); break;
    case 'mk-del': if(await saveMarket(n=>{ n.items=n.items.filter(x=>x.id!==b.dataset.id); }, tr('bd.deleted'))) closeDlg(); break;
    case 'mk-buy': openBuy(b.dataset.id); break;
    case 'ord-ok': openOrderOk(b.dataset.uid, b.dataset.id); break;
    case 'ord-no': try{ const {uid,id}=b.dataset; await setOrderStatus(uid, id, {st:'no', at:nowTs()}); const o=(S.orders[uid]?.items||[]).find(x=>x.id===id), it=o&&mkItem(o.itemId); notify('order',[uid],()=>({subject:tr('em.ordNo',{item:it?.title||''}), kicker:tr('em.ordK'), lines:[tr('em.payNoL')]})); }catch(e){ dbErr(e,'market'); } break;
    case 'ord-done': { const {uid,id}=b.dataset; try{ const cur=S.ostat[uid]?.[id]||{}; await setOrderStatus(uid, id, {...cur, st:'done', at:nowTs()}); const o=(S.orders[uid]?.items||[]).find(x=>x.id===id), it=o&&mkItem(o.itemId); notify('order',[uid],()=>({subject:tr('em.ordDone',{item:it?.title||''}), kicker:tr('em.ordK'), lines:[cur.msg||'']})); }catch(e){ dbErr(e,'market'); } break; }
    case 'ord-undo': { const {uid,id}=b.dataset, cur=S.ostat[uid]?.[id]; try{ await setOrderStatus(uid, id, cur?.st==='done' ? {...cur, st:'paid'} : null); }catch(e){ dbErr(e,'market'); } break; }
    case 'ord-cancel': { const next=clone(S.myOrders)||{items:[]}; next.items=(next.items||[]).filter(x=>x.id!==b.dataset.id); try{ await S.db.doc('orders/'+S.uid).set(next); toast(tr('pf.cancelled')); }catch(e){ dbErr(e,'order'); } break; }
    case 'pc-cancel': { const next=clone(S.myClaims)||{items:[]}; next.items=(next.items||[]).filter(x=>x.id!==b.dataset.id); try{ await S.db.doc('payClaims/'+S.uid).set(next); toast(tr('pf.cancelled')); }catch(e){ dbErr(e,'pay'); } break; }
    case 'pc-ok': openClaimConfirm(b.dataset.uid, b.dataset.id); break;
    case 'pc-no': try{ const {uid,id}=b.dataset; await setClaimStatus(uid, id, 'no'); const c=(S.claims[uid]?.items||[]).find(x=>x.id===id); if(c) notify('pay',[uid],()=>({subject:tr('em.payNo',{sum:som(c.amount)}), kicker:tr('em.payK'), lines:[tr('em.payNoL')]})); }catch(e){ dbErr(e,'payset'); } break;
    case 'pc-undo': { const {uid,id}=b.dataset; try{ if(S.lg.payments.some(p=>p.id===claimPayId(uid,id))) await S.db.doc('ledger/main/payments/'+claimPayId(uid,id)).delete(); await setClaimStatus(uid, id, null); toast(tr('pf.undone')); }catch(e){ dbErr(e,'payset'); } break; }
    case 'pm-copy': { const v=b.dataset.v; try{ await navigator.clipboard.writeText(v); toast(tr('pf.copied')); }catch(e){ const r=document.createRange(); r.selectNodeContents(b.closest('.pm').querySelector('.pm-num')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(tr('t.selected')); } break; }
    case 'pm-del': await savePayInfo(n=>{ n.methods=n.methods.filter(m=>m.id!==b.dataset.id); }, tr('bd.deleted')); break;
    case 'pm-add': { const err=$('#pm-err'), number=$('#pm-num').value.trim(), link=$('#pm-link').value.trim();
      if(!number){ err.textContent=tr('pf.needNum'); break; } if(link && !safeLink(link)){ err.textContent=tr('pf.badLink'); break; }
      if(await savePayInfo(n=>{ n.methods.push({id:newId(), kind:$('#pm-kind').value, number, holder:$('#pm-holder').value.trim(), link}); }, tr('pf.saved'))) refresh(); break; }
    case 'bk-cancel': { const next=clone(S.myBook)||{items:[]}; next.items=(next.items||[]).filter(x=>x.id!==b.dataset.id); try{ await S.db.doc('bookings/'+S.uid).set(next); toast(tr('bk.cancelled')); }catch(e){ dbErr(e,'book'); } break; }
  }
});
document.addEventListener('change', ev=>{
  const t=ev.target; if(t.dataset && t.dataset.act==='learn'){ const s=new Set(LS.get('learned:'+S.uid,[])); t.checked? s.add(t.dataset.w): s.delete(t.dataset.w); LS.set('learned:'+S.uid,[...s]); renderMain(); }
});
document.addEventListener('keydown', ev=>{
  if(S.pop && S.pop.a){
    if(ev.key==='Escape'){ closePop(); return; }
    if(ev.key==='Enter' && ev.target.closest('#pop') && ev.target.tagName==='INPUT'){ ev.preventDefault(); popSave(); return; }
    if(ev.altKey && /^[1-9]$/.test(ev.key)){ ev.preventDefault(); const t=TYPES[+ev.key-1]; S.pop.a.type=t.k; document.querySelectorAll('#pop .types .tchip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===t.k)); const w=$('#pf-fix-wrap'); if(w) w.hidden=t.k==='good'; }
  } else if(ev.key==='Escape') closePop();
  if(ev.key==='Enter' && (ev.target.id==='login-email'||ev.target.id==='login-pass')){ $('#main .paper .btn.primary')?.click(); }
  if(ev.key==='Enter' && ev.target.id==='bank-new'){ $('[data-act="bank-add"]').click(); }
  if(ev.key==='Enter' && ev.target.id==='plan-new'){ $('[data-act="plan-add"]')?.click(); }
  if((ev.key==='Enter'||ev.key===' ') && ev.target.classList?.contains('mk')){ ev.preventDefault(); ev.target.click(); }
});
window.addEventListener('resize', ()=>{ if(S.pop) closePop(); });
function setLang(l){
  if(!DICT[l] || l===LANG) return;
  if(S.view.name==='login'){ const em=$('#login-email'); if(em) S.view.email=em.value; }
  const sn=$('#setup-name'); if(sn && S.me) S.me.name=sn.value;
  LANG=l; LS.set('lang',l); document.documentElement.lang=l; syncContact();
  const reopen = S.dlg; closeDlg();
  closePop(); renderTop(); renderNav(); renderMain();
  if(reopen?.type==='st') openLgStudent(reopen.id);
}
document.addEventListener('scroll', ()=>{ if(S.pop && !$('#pop .pop')?.contains(document.activeElement)) closePop(); }, {passive:true});

renderTop(); boot();
</script>
</body>
